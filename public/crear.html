<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alta de Usuario — Sistema de Gestión</title>

  <style>
    /* ── PALETA COLUMBIA ── */
    :root {
      --color-primario:        #0b6967;
      --color-primario-oscuro: #094f4d;
      --color-primario-claro:  #0e8a87;
      --color-acento:          #c47a28;
      --color-fondo:           #f2f8f8;
      --color-superficie:      #ffffff;
      --color-texto:           #172828;
      --color-texto-medio:     #3d5e5e;
      --color-borde:           #bdd8d8;
      --color-exito:           #0d6b4f;
      --color-fondo-exito:     #d4edda;
      --color-error:           #842029;
      --color-fondo-error:     #f8d7da;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background:  var(--color-fondo);
      color:       var(--color-texto);
      min-height:  100vh;
      display:     flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    .encabezado-pagina {
      background: linear-gradient(135deg,
        var(--color-primario-oscuro) 0%,
        var(--color-primario) 100%);
      color: #fff;
      padding: 18px 32px;
      box-shadow: 0 3px 10px rgba(9,79,77,0.3);
    }
    .encabezado-pagina h1 { font-size: 1.1rem; font-weight: 700; }
    .encabezado-pagina p  { font-size: 0.75rem; opacity: 0.75; margin-top: 2px; }

    /* ── CONTENEDOR ── */
    .contenedor-central {
      flex-grow:       1;
      display:         flex;
      align-items:     center;
      justify-content: center;
      padding:         36px 16px;
    }

    /* ── TARJETA FORMULARIO ── */
    .tarjeta-formulario {
      background:    var(--color-superficie);
      border-radius: 14px;
      border:        1px solid var(--color-borde);
      box-shadow:    0 4px 20px rgba(11,105,103,0.09);
      padding:       36px 32px;
      width:         100%;
      max-width:     460px;
    }
    .tarjeta-formulario h2 {
      font-size:     1.1rem;
      color:         var(--color-primario);
      margin-bottom: 6px;
      font-weight:   700;
    }
    .tarjeta-formulario .subtitulo {
      font-size:     0.82rem;
      color:         var(--color-texto-medio);
      margin-bottom: 22px;
    }

    /* ── ETIQUETA DE CAMPO ── */
    .etiqueta-campo {
      display:       block;
      font-size:     0.82rem;
      font-weight:   600;
      color:         var(--color-texto-medio);
      margin-bottom: 5px;
      margin-top:    14px;
    }

    /* ── CAMPO DE ENTRADA ── */
    .campo-formulario {
      width:         100%;
      padding:       10px 14px;
      border:        1.5px solid var(--color-borde);
      border-radius: 8px;
      font-size:     0.95rem;
      font-family:   inherit;
      color:         var(--color-texto);
      background:    var(--color-fondo);
      transition:    border-color 0.2s;
      display:       block;
    }
    .campo-formulario:focus {
      outline:      none;
      border-color: var(--color-primario);
      background:   var(--color-superficie);
    }

    /* ── GRUPO DE BOTONES ── */
    .grupo-botones {
      display: flex;
      gap:     10px;
      margin-top: 22px;
    }
    .boton-guardar {
      flex:          1;
      padding:       11px;
      background:    var(--color-primario);
      color:         #fff;
      border:        none;
      border-radius: 8px;
      font-size:     0.95rem;
      font-weight:   700;
      cursor:        pointer;
      transition:    background 0.2s;
    }
    .boton-guardar:hover { background: var(--color-primario-claro); }
    .boton-volver {
      padding:       11px 18px;
      background:    transparent;
      color:         var(--color-texto-medio);
      border:        1.5px solid var(--color-borde);
      border-radius: 8px;
      font-size:     0.9rem;
      font-weight:   600;
      cursor:        pointer;
      transition:    border-color 0.2s, color 0.2s;
    }
    .boton-volver:hover {
      border-color: var(--color-primario);
      color:        var(--color-primario);
    }

    /* ── ÁREA DE MENSAJES ── */
    .area-mensaje {
      margin-top:    16px;
      padding:       10px 14px;
      border-radius: 8px;
      font-size:     0.88rem;
      display:       none;
    }
    .area-mensaje.exito {
      display:    block;
      background: var(--color-fondo-exito);
      color:      var(--color-exito);
      border:     1px solid #a3d9b8;
    }
    .area-mensaje.error {
      display:    block;
      background: var(--color-fondo-error);
      color:      var(--color-error);
      border:     1px solid #f5c2c7;
    }
  </style>
</head>

<body>

  <div class="encabezado-pagina">
    <h1>Alta de Usuario</h1>
    <p>Registrar un nuevo usuario en el sistema Oracle XE</p>
  </div>

  <div class="contenedor-central">
    <div class="tarjeta-formulario">

      <h2>Datos del Nuevo Usuario</h2>
      <p class="subtitulo">Todos los campos son obligatorios.</p>

      <!-- id="formularioAlta" → JavaScript lo identifica para escuchar el submit -->
      <form id="formularioAlta">

        <label class="etiqueta-campo" for="campoNombre">Nombre</label>
        <input
          type="text"
          id="campoNombre"
          class="campo-formulario"
          placeholder="Ej: María"
          required>

        <label class="etiqueta-campo" for="campoApellido">Apellido</label>
        <input
          type="text"
          id="campoApellido"
          class="campo-formulario"
          placeholder="Ej: González"
          required>

        <label class="etiqueta-campo" for="campoEmail">Email</label>
        <input
          type="email"
          id="campoEmail"
          class="campo-formulario"
          placeholder="Ej: maria@correo.com"
          required>
        <!-- type="email" → el navegador valida que tenga formato correcto (x@y.z) -->

        <label class="etiqueta-campo" for="campoContrasena">Contraseña</label>
        <input
          type="password"
          id="campoContrasena"
          class="campo-formulario"
          placeholder="Mínimo 6 caracteres"
          required
          minlength="6">
        <!-- minlength="6" → el navegador bloquea si tiene menos de 6 caracteres -->

        <div class="grupo-botones">
          <button type="submit" class="boton-guardar">Guardar Usuario</button>
          <button type="button" class="boton-volver" onclick="window.location.href='menu.html'">← Volver</button>
        </div>

      </form>

      <!-- Área donde JavaScript mostrará el resultado de la operación -->
      <div id="areaDeResultado" class="area-mensaje"></div>

    </div>
  </div>

  <!-- ══════════════════════════════════════════════════════════
       JAVASCRIPT — LÓGICA DE ALTA DE USUARIO
  ══════════════════════════════════════════════════════════ -->
  <script>
    // ── REFERENCIAS A ELEMENTOS DEL DOM ──────────────────────
    const formularioAlta  = document.getElementById('formularioAlta');
    const areaDeResultado = document.getElementById('areaDeResultado');

    // ── FUNCIÓN: Mostrar mensaje de resultado ─────────────────
    function mostrarMensaje(texto, tipo) {
      areaDeResultado.textContent = texto;
      areaDeResultado.className   = 'area-mensaje ' + tipo;
    }

    // ── FUNCIÓN: Limpiar todos los campos del formulario ──────
    function limpiarFormulario() {
      formularioAlta.reset(); // reset() devuelve todos los campos a su valor inicial (vacío)
    }

    // ── FUNCIÓN: Recolectar datos del formulario ──────────────
    // Separa la lógica de "leer campos" de la lógica de "enviar datos".
    function obtenerDatosDelFormulario() {
      return {
        nombre:   document.getElementById('campoNombre').value.trim(),
        apellido: document.getElementById('campoApellido').value.trim(),
        email:    document.getElementById('campoEmail').value.trim(),
        passw:    document.getElementById('campoContrasena').value
      };
    }

    // ── FUNCIÓN PRINCIPAL: Enviar nuevo usuario al servidor ───
    // "async" → permite usar "await" para esperar la respuesta del servidor sin bloquear.
    async function enviarFormularioDeCreacion(evento) {

      // PASO 1: Cancelamos el comportamiento por defecto (evitamos recargar la página).
      evento.preventDefault();

      // PASO 2: Recolectamos los datos del formulario en un objeto.
      const datosDelNuevoUsuario = obtenerDatosDelFormulario();

      // PASO 3: Enviamos los datos al servidor con fetch() usando método POST.
      // POST → se usa para CREAR recursos nuevos en el servidor.
      // La ruta '/api/usuarios' corresponde a la ruta POST definida en routes/usuarios.js.
      try {
        const respuestaDelServidor = await fetch('/api/usuarios', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' }, // Le avisamos que mandamos JSON
          body:    JSON.stringify(datosDelNuevoUsuario)     // Convertimos el objeto a texto JSON
        });

        // PASO 4: Leemos el JSON que devuelve el servidor.
        const datosRecibidos = await respuestaDelServidor.json();

        // PASO 5: Mostramos el resultado y limpiamos el formulario si fue exitoso.
        if (datosRecibidos.exito) {
          mostrarMensaje('✓ ' + datosRecibidos.mensaje, 'exito');
          limpiarFormulario(); // Formulario listo para registrar otro usuario
        } else {
          mostrarMensaje('✗ ' + datosRecibidos.mensaje, 'error');
        }

      } catch (errorDeRed) {
        // Error de red: el servidor no está corriendo.
        mostrarMensaje('No se pudo conectar con el servidor. ¿Está corriendo Node.js?', 'error');
        console.error('[CREAR] Error de red:', errorDeRed.message);
      }
    }

    // ── EVENTO: Escuchamos el submit del formulario ───────────
    formularioAlta.addEventListener('submit', enviarFormularioDeCreacion);
  </script>

</body>
</html>
