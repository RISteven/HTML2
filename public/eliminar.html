<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baja de Usuario — Sistema de Gestión</title>

  <style>
    :root {
      --color-primario:        #0b6967;
      --color-primario-oscuro: #094f4d;
      --color-primario-claro:  #0e8a87;
      --color-acento:          #c47a28;
      --color-fondo:           #f2f8f8;
      --color-superficie:      #ffffff;
      --color-texto:           #172828;
      --color-texto-medio:     #3d5e5e;
      --color-borde:           #bdd8d8;
      --color-peligro:         #9b3930;
      --color-fondo-peligro:   #fdecea;
      --color-exito:           #0d6b4f;
      --color-fondo-exito:     #d4edda;
      --color-error:           #842029;
      --color-fondo-error:     #f8d7da;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background:  var(--color-fondo);
      color:       var(--color-texto);
      min-height:  100vh;
      display:     flex;
      flex-direction: column;
    }

    .encabezado-pagina {
      background: linear-gradient(135deg, var(--color-primario-oscuro) 0%, var(--color-primario) 100%);
      color: #fff;
      padding: 18px 32px;
      box-shadow: 0 3px 10px rgba(9,79,77,0.3);
    }
    .encabezado-pagina h1 { font-size: 1.1rem; font-weight: 700; }
    .encabezado-pagina p  { font-size: 0.75rem; opacity: 0.75; margin-top: 2px; }

    .contenedor-central {
      flex-grow: 1; display: flex;
      align-items: center; justify-content: center;
      padding: 36px 16px;
    }

    .tarjeta-formulario {
      background: var(--color-superficie);
      border-radius: 14px;
      border: 1px solid var(--color-borde);
      box-shadow: 0 4px 20px rgba(11,105,103,0.09);
      padding: 36px 32px;
      width: 100%; max-width: 460px;
    }
    .tarjeta-formulario h2 {
      font-size: 1.1rem; color: var(--color-peligro);
      margin-bottom: 6px; font-weight: 700;
    }
    .tarjeta-formulario .subtitulo {
      font-size: 0.82rem; color: var(--color-texto-medio); margin-bottom: 22px;
    }

    /* ── ADVERTENCIA DE OPERACIÓN IRREVERSIBLE ── */
    .advertencia-peligro {
      background: var(--color-fondo-peligro);
      border-left: 4px solid var(--color-peligro);
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 0.82rem;
      color: var(--color-peligro);
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .etiqueta-campo {
      display: block; font-size: 0.82rem; font-weight: 600;
      color: var(--color-texto-medio); margin-bottom: 5px; margin-top: 14px;
    }
    .campo-formulario {
      width: 100%; padding: 10px 14px;
      border: 1.5px solid var(--color-borde); border-radius: 8px;
      font-size: 0.95rem; font-family: inherit; color: var(--color-texto);
      background: var(--color-fondo); transition: border-color 0.2s; display: block;
    }
    .campo-formulario:focus {
      outline: none; border-color: var(--color-peligro);
      background: var(--color-superficie);
    }

    .grupo-botones { display: flex; gap: 10px; margin-top: 22px; }
    .boton-eliminar {
      flex: 1; padding: 11px;
      background: var(--color-peligro); color: #fff;
      border: none; border-radius: 8px;
      font-size: 0.95rem; font-weight: 700; cursor: pointer;
      transition: background 0.2s;
    }
    .boton-eliminar:hover { background: #7a2c25; }
    .boton-volver {
      padding: 11px 18px; background: transparent;
      color: var(--color-texto-medio);
      border: 1.5px solid var(--color-borde);
      border-radius: 8px; font-size: 0.9rem;
      font-weight: 600; cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    .boton-volver:hover { border-color: var(--color-primario); color: var(--color-primario); }

    .area-mensaje {
      margin-top: 16px; padding: 10px 14px;
      border-radius: 8px; font-size: 0.88rem; display: none;
    }
    .area-mensaje.exito {
      display: block; background: var(--color-fondo-exito);
      color: var(--color-exito); border: 1px solid #a3d9b8;
    }
    .area-mensaje.error {
      display: block; background: var(--color-fondo-error);
      color: var(--color-error); border: 1px solid #f5c2c7;
    }
  </style>
</head>

<body>

  <div class="encabezado-pagina">
    <h1>Baja de Usuario</h1>
    <p>Eliminar un usuario del sistema de forma permanente</p>
  </div>

  <div class="contenedor-central">
    <div class="tarjeta-formulario">

      <h2>⚠ Eliminar Usuario</h2>
      <p class="subtitulo">Esta acción no se puede deshacer.</p>

      <div class="advertencia-peligro">
        <strong>Atención:</strong> Al eliminar un usuario se borrará permanentemente de la base de datos Oracle.
        El sistema pedirá confirmación antes de proceder.
      </div>

      <form id="formularioBaja">

        <label class="etiqueta-campo" for="campoNombre">Nombre del usuario a eliminar</label>
        <input
          type="text"
          id="campoNombre"
          class="campo-formulario"
          placeholder="Escribí el nombre exacto"
          required>

        <div class="grupo-botones">
          <button type="submit" class="boton-eliminar">Eliminar Usuario</button>
          <button type="button" class="boton-volver" onclick="window.location.href='menu.html'">← Volver</button>
        </div>

      </form>

      <div id="areaDeResultado" class="area-mensaje"></div>

    </div>
  </div>

  <!-- ══════════════════════════════════════════════════════════
       JAVASCRIPT — LÓGICA DE BAJA DE USUARIO
  ══════════════════════════════════════════════════════════ -->
  <script>
    const formularioBaja  = document.getElementById('formularioBaja');
    const areaDeResultado = document.getElementById('areaDeResultado');

    // ── FUNCIÓN: Mostrar mensaje de resultado ─────────────────
    function mostrarMensaje(texto, tipo) {
      areaDeResultado.textContent = texto;
      areaDeResultado.className   = 'area-mensaje ' + tipo;
    }

    // ── FUNCIÓN PRINCIPAL: Enviar eliminación al servidor ─────
    async function enviarFormularioDeEliminacion(evento) {

      // PASO 1: Evitar recarga de página.
      evento.preventDefault();

      // PASO 2: Leer el nombre del usuario a eliminar.
      const nombreAEliminar = document.getElementById('campoNombre').value.trim();

      // PASO 3: Confirmación obligatoria antes de eliminar.
      // confirm() muestra un diálogo nativo del navegador con Aceptar/Cancelar.
      // Si el usuario hace clic en Cancelar, "confirmo" es false y no hacemos nada.
      const confirmo = confirm(
        `¿Está seguro que desea eliminar permanentemente al usuario "${nombreAEliminar}"?\n\nEsta acción NO se puede deshacer.`
      );

      if (!confirmo) {
        mostrarMensaje('Operación cancelada por el usuario.', 'error');
        return; // Salimos sin enviar nada al servidor
      }

      // PASO 4: Enviamos la petición DELETE al servidor.
      // DELETE → se usa para ELIMINAR un recurso.
      // El nombre va en la URL: /api/usuarios/María
      // No necesita body porque el nombre ya va en la URL.
      // encodeURIComponent() convierte caracteres especiales (espacios, tildes) para la URL.
      try {
        const respuestaDelServidor = await fetch(`/api/usuarios/${encodeURIComponent(nombreAEliminar)}`, {
          method: 'DELETE'
          // Sin headers ni body — DELETE solo necesita la URL
        });

        // PASO 5: Leer la respuesta del servidor.
        const datosRecibidos = await respuestaDelServidor.json();

        // PASO 6: Mostrar resultado.
        if (datosRecibidos.exito) {
          mostrarMensaje('✓ ' + datosRecibidos.mensaje, 'exito');
          formularioBaja.reset(); // Limpiamos el campo para una nueva operación
        } else {
          mostrarMensaje('✗ ' + datosRecibidos.mensaje, 'error');
        }

      } catch (errorDeRed) {
        mostrarMensaje('No se pudo conectar con el servidor. ¿Está corriendo Node.js?', 'error');
        console.error('[ELIMINAR] Error de red:', errorDeRed.message);
      }
    }

    // ── EVENTO ────────────────────────────────────────────────
    formularioBaja.addEventListener('submit', enviarFormularioDeEliminacion);
  </script>

</body>
</html>
